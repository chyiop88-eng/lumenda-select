name: LUMENDA authorized security probes
on:
  push:
    branches: [security-audit-2026-10-12]
permissions:
  contents: read
jobs:
  safe-public-endpoint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Non-destructive checks of production API permissions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, ssl, sys, urllib.error, urllib.request, time
          target = "https://lumenda-select-preview.onrender.com"
          rows = []
          context=ssl.create_default_context()
          def probe(name, method, path, expected, headers=None, body=None, check=None):
              request=urllib.request.Request(target+path,method=method,headers={"User-Agent":"lumenda-authorized-audit/1.0",**(headers or {})},data=body)
              result=None; payload=b""; response_headers={}
              for attempt in range(2):
                  try:
                      with urllib.request.urlopen(request,timeout=40,context=context) as res:
                          result=res.status;response_headers=dict(res.headers);payload=res.read(4096)
                  except urllib.error.HTTPError as e:
                      result=e.code;response_headers=dict(e.headers);payload=e.read(4096)
                  except Exception as e:
                      result="ERROR";payload=repr(type(e).__name__).encode()
                  if result!="ERROR":break
                  time.sleep(2)
              ok=result in expected
              if check is not None and ok:
                  try:ok=bool(check(payload,response_headers))
                  except Exception:ok=False
              rows.append((name,ok,result))
              print(("[PASS]" if ok else "[FAIL]"),name,"HTTP",result,flush=True)
              time.sleep(0.35)
          probe("health", "GET","/api/health",{200},check=lambda p,h:json.loads(p).get('ordersEnabled') is True and json.loads(p).get('featuredSKUs')==['FTE230','GENOPTICS50'] and json.loads(p).get('shippingPolicy',{}).get('freeShippingThresholdHKD')==4000)
          probe("homepage-headers","GET","/",{200},check=lambda p,h:h.get('X-Frame-Options','').upper()=='DENY' and 'frame-ancestors' in h.get('Content-Security-Policy','') and h.get('X-Content-Type-Options','')=='nosniff')
          probe("admin-login-page","GET","/admin",{200})
          probe("anonymous-order-list-denied","GET","/api/orders",{401})
          probe("anonymous-admin-session-denied","GET","/api/admin/session",{401})
          probe("forged-cookie-session-denied","GET","/api/admin/session",{401},{"Cookie":"lumenda_admin=Zm9yZ2VkLnNlc3Npb24"})
          probe("forged-cookie-order-list-denied","GET","/api/orders",{401},{"Cookie":"lumenda_admin=Zm9yZ2VkLnNlc3Npb24"})
          probe("anonymous-order-change-denied","PATCH","/api/orders/LMD-AUDIT-DOES-NOT-EXIST",{401},{"Content-Type":"application/json"},b'{"status":"shipped"}')
          probe("anonymous-image-upload-denied","POST","/api/admin/media/fte",{401},{"Content-Type":"image/png"},b'not-a-real-image')
          probe("wrong-password-rejected","POST","/api/admin/login",{401},{"Content-Type":"application/json"},b'{"username":"lumenda_owner","password":"audit_will_never_match_password"}')
          probe("foreign-origin-login-denied","POST","/api/admin/login",{401},{"Content-Type":"application/json","Origin":"https://not-the-shop.invalid"},b'{"username":"lumenda_owner","password":"wrong"}')
          probe("invalid-order-no-persistence","POST","/api/orders",{400},{"Content-Type":"application/json"},b'{}')
          for path in ["/server.js","/.env","/package.json","/config/products.json","/.git/config"]:
              probe("private-file-blocked:"+path,"GET",path,{404})
          probe("unsafe-options-not-open","OPTIONS","/api/orders",{405})
          passed=sum(ok for _,ok,_ in rows)
          print(f"SUMMARY: {passed}/{len(rows)} probes passed; no real orders, data modifications, or successful logins attempted.",flush=True)
          if passed!=len(rows):sys.exit(1)
          PY
