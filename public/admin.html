<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LUMENDA SELECT · Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header><nav><div class="brand">LUMENDA SELECT<small>Owner administration</small></div><a href="/" class="cta">返回商店</a></nav></header><main class="wrap"><h1>網站管理後台</h1><p class="muted">網站現只接受 SK-II 神仙水及小燈泡兩款明星產品訂單。登入後可管理訂單、匯出 CSV、上傳及更換兩張廣告圖。Session 最長 8 小時。</p><section class="card" id="loginCard"><h3>管理員登入</h3><div class="field-grid"><div class="field"><label for="username">帳號</label><input id="username" autocomplete="username" placeholder="管理員帳號"></div><div class="field"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="管理員密碼"></div></div><div class="button-row" style="margin-top:14px"><button class="btn" id="login">登入後台</button></div><div class="status" id="loginStatus" role="status"></div></section><section id="adminArea" hidden><div class="notice" style="margin:0 0 12px">配送規則：經確認商品小計滿 HK$4,000 免運費；未滿 HK$4,000 按目的地報運費及適用稅費。免運不等於免稅；所有價格及免運資格均待人工核實。</div><section class="card"><h3>廣告圖管理</h3><p class="muted">支援 JPG、PNG、WebP；每張最多 4 MB。上傳成功後首頁會直接使用新圖。</p><div class="field-grid"><div class="field"><label for="fteFile">神仙水 Facial Treatment Essence</label><input id="fteFile" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn" id="uploadFte" type="button" style="margin-top:10px">上傳神仙水廣告圖</button></div><div class="field"><label for="auraFile">小燈泡 GenOptics Aura Essence</label><input id="auraFile" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn" id="uploadAura" type="button" style="margin-top:10px">上傳小燈泡廣告圖</button></div></div><div class="status" id="mediaStatus" role="status"></div></section><section class="card" style="margin-top:16px"><div class="button-row"><button class="btn" id="refresh">重新讀取訂單</button><button class="btn outline" id="export" disabled>匯出 CSV</button><button class="btn outline" id="logout">登出</button></div><div class="status" id="status" role="status"></div></section><div id="orders"></div></section></main><footer>LUMENDA SELECT · Private admin area</footer><script src="/admin.js" defer></script></body></html>
